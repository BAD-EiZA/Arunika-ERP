name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci_test
      KINDE_ISSUER_URL: https://test.kinde.example
      KINDE_CLIENT_ID: ci
      KINDE_CLIENT_SECRET: ci
      KINDE_REDIRECT_URL: http://localhost:3000/api/auth/kinde_callback
      KINDE_LOGOUT_REDIRECT_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage=false
      - run: npx tsx scripts/check-integrity.ts
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
      - run: npm run build
